  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #0d1b3e;
      --accent: #2e7df7;
      --white: #ffffff;
      --gray: #a0aec0;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--navy);
      color: var(--white);
      min-height: 100vh;
      padding: 16px;
    }

    .header {
      display: flex; align-items: center; gap: 14px;
      margin-bottom: 14px;
    }

    .back-btn {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px; color: var(--white);
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 13px; padding: 7px 14px;
      cursor: pointer; text-decoration: none;
    }

    .header-info h2 { font-size: 17px; font-weight: 700; }
    .header-info p  { font-size: 12px; color: var(--gray); margin-top: 2px; }

    .legend {
      display: flex; flex-wrap: wrap; gap: 10px;
      margin-bottom: 14px;
    }

    .legend-item {
      display: flex; align-items: center; gap: 5px;
      font-size: 11px; color: var(--gray);
    }

    .legend-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }

    .map-container {
      background: #f0ede8;
      border-radius: 10px;
      padding: 16px;
      overflow-x: auto;
    }

    /* 팝업 */
    .popup {
      position: fixed;
      background: rgba(13,27,62,0.97);
      border: 1px solid rgba(46,125,247,0.4);
      border-radius: 10px;
      padding: 14px 18px;
      min-width: 200px;
      z-index: 999;
      display: none;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }

    .popup.show { display: block; }
    .popup-num { font-size: 11px; color: var(--accent); font-weight: 600; margin-bottom: 3px; }
    .popup-name { font-size: 14px; font-weight: 700; margin-bottom: 6px; line-height: 1.4; }
    .popup-type {
      display: inline-block; font-size: 11px;
      padding: 2px 8px; border-radius: 4px; font-weight: 500;
    }
    .popup-hint { font-size: 10px; color: var(--gray); margin-top: 8px; }
  </style>
</head>

  <!-- 팝업 -->
  <div class="popup" id="popup">
    <div class="popup-num" id="popup-num"></div>
    <div class="popup-name" id="popup-name"></div>
    <div class="popup-type" id="popup-type"></div>
    <div class="popup-hint">클릭하여 닫기</div>
  </div>

  <script>
    const typeColors = {
      '실험실':     { bg: '#1e3a8a', text: '#93c5fd' },
      '연구실':     { bg: '#3b0764', text: '#c4b5fd' },
      '강의실':     { bg: '#064e3b', text: '#6ee7b7' },
      '세미나실':   { bg: '#0c4a6e', text: '#7dd3fc' },
      '교수실':     { bg: '#831843', text: '#fbcfe8' },
      '사무/학생회':{ bg: '#78350f', text: '#fde68a' },
      '기타':       { bg: '#1f2937', text: '#d1d5db' },
    };

    const popup = document.getElementById('popup');

    document.querySelectorAll('.room').forEach(room => {
      room.addEventListener('click', function(e) {
        e.stopPropagation();
        const num  = this.dataset.num;
        const name = this.dataset.name;
        const type = this.dataset.type;

        document.getElementById('popup-num').textContent  = num + '호';
        document.getElementById('popup-name').textContent = name;

        const ptype = document.getElementById('popup-type');
        ptype.textContent = type;
        const c = typeColors[type] || typeColors['기타'];
        ptype.style.background = c.bg;
        ptype.style.color = c.text;
        ptype.style.padding = '2px 8px';
        ptype.style.borderRadius = '4px';

        const rects = this.querySelectorAll('rect');
        const r = rects[0];
        if (r) {
          const br = r.getBoundingClientRect();
          let left = br.left + br.width / 2 - 100;
          let top  = br.top + window.scrollY - 130;
          if (left < 10) left = 10;
          if (top < 10) top = 10;
          popup.style.left = left + 'px';
          popup.style.top  = top + 'px';
        }
        popup.classList.add('show');
      });
    });

    document.addEventListener('click', () => popup.classList.remove('show'));
  </script>
